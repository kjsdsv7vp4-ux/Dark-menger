<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pythonia Adventure</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10182b;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,9,22,.9);color:white;text-align:center}
.box{width:min(88vw,480px);padding:28px;border-radius:25px;background:#182545;border:2px solid #ffffff22}
h1{font-size:48px;margin:0 0 10px}
button{font-size:20px;font-weight:bold;color:white;background:#477cff;border:0;border-radius:16px;padding:15px 28px}
#hud{position:fixed;top:12px;left:12px;right:12px;color:white;display:flex;justify-content:space-between;font-weight:bold;font-size:18px;pointer-events:none}
#controls{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.group{display:flex;gap:12px;pointer-events:auto}
.control{width:70px;height:70px;border-radius:22px;border:2px solid #ffffff33;background:#17233fe8;color:white;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:bold;user-select:none}
.attack{background:#8e315ee8}.jump{background:#286bbde8}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><span>❤️ <b id="life">3</b></span><span>⭐ <b id="score">0</b></span><span>Level <b id="level">1</b>/4</span></div>

<div id="controls">
 <div class="group">
  <div class="control" data-key="left">◀</div>
  <div class="control" data-key="right">▶</div>
 </div>
 <div class="group">
  <div class="control attack" data-key="attack">⚔️</div>
  <div class="control jump" data-key="jump">⬆️</div>
 </div>
</div>

<div id="menu">
 <div class="box">
  <h1>PYTHONIA</h1>
  <p id="message">Een avonturenspel speciaal voor je iPhone.</p>
  <button id="play">SPELEN 🎮</button>
  <p style="opacity:.6;font-size:13px">Gebruik de knoppen onderaan om te bewegen.</p>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*dpr;canvas.height=H*dpr;
 canvas.style.width=W+"px";canvas.style.height=H+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);resize();

const input={left:false,right:false,attack:false,jump:false};
const colors=[
 ["#69c9ff","#e9fbff","#24523c","#53df8b"],
 ["#44277a","#11172d","#25213c","#b889ff"],
 ["#ff794d","#2b1119","#38201d","#ffd15a"],
 ["#314a72","#080b16","#1b202c","#ff6680"]
];

let playing=false,stage=0,score=0,lives=3,camera=0;
let platforms=[],coins=[],enemies=[],particles=[];
const hero={x:100,y:100,w:36,h:50,vx:0,vy:0,onGround:false,face:1,attackTimer:0,invincible:0};

function updateHUD(){
 document.getElementById("life").textContent=lives;
 document.getElementById("score").textContent=score;
 document.getElementById("level").textContent=stage+1;
}

function makeStage(){
 platforms=[];coins=[];enemies=[];particles=[];camera=0;
 const length=3600+stage*500;
 let x=0;
 let y=H*.72;
 platforms.push({x:-500,y:y,w:900,h:50});
 while(x<length){
   x+=100+Math.random()*100;
   y=Math.max(H*.42,Math.min(H*.76,y+(Math.random()-.5)*90));
   const w=180+Math.random()*180;
   platforms.push({x:x,y:y,w:w,h:28});
   coins.push({x:x+w*.5,y:y-48,r:10,got:false});
   if(x>500 && Math.random()<.7){
     enemies.push({x:x+w*.65,y:y-42,w:36,h:36,hp:1,dir:Math.random()<.5?-1:1,boss:false,dead:false});
   }
   x+=w;
 }
 platforms.push({x:length-450,y:H*.70,w:700,h:40});

 if(stage===3){
   enemies.push({x:length-300,y:H*.28,w:120,h:100,hp:10,maxHp:10,dir:-1,boss:true,dead:false});
 }
 hero.x=100;hero.y=100;hero.vx=0;hero.vy=0;
 updateHUD();
}

function particle(x,y,color){
 for(let i=0;i<8;i++){
  particles.push({x:x,y:y,vx:(Math.random()-.5)*5,vy:(Math.random()-.7)*5,life:30,color:color});
 }
}

function overlap(a,b){
 return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}

function damage(){
 if(hero.invincible>0)return;
 lives--;hero.invincible=90;particle(hero.x,hero.y,"#ff5577");updateHUD();
 if(lives<=0){gameOver("Game over","Probeer het opnieuw!");}
 else {hero.x=Math.max(100,camera+100);hero.y=100;hero.vy=0;}
}

function doAttack(){
 const sword={
  x:hero.face>0?hero.x+20:hero.x-50,
  y:hero.y+8,w:50,h:34
 };
 for(const e of enemies){
  if(!e.dead && overlap(sword,e)){
   e.hp--;score+=e.boss?25:10;particle(e.x,e.y,"#ffd34d");
   if(e.hp<=0){e.dead=true;particle(e.x,e.y,e.boss?"#ff6680":"#b989ff");}
   updateHUD();
  }
 }
}

function update(){
 if(!playing)return;

 if(input.left){hero.vx-=.65;hero.face=-1}
 if(input.right){hero.vx+=.65;hero.face=1}
 hero.vx*=.84;
 hero.vx=Math.max(-7,Math.min(7,hero.vx));

 if(input.jump && hero.onGround){
  hero.vy=-14;
  hero.onGround=false;
 }
 input.jump=false;

 hero.vy+=.65;
 if(hero.vy>16)hero.vy=16;
 hero.x+=hero.vx;
 hero.y+=hero.vy;

 if(input.attack && hero.attackTimer<=0){
  hero.attackTimer=18;doAttack();
 }
 input.attack=false;
 if(hero.attackTimer>0)hero.attackTimer--;
 if(hero.invincible>0)hero.invincible--;

 hero.onGround=false;
 for(const p of platforms){
  if(hero.vy>=0 &&
     hero.x+hero.w>p.x && hero.x<p.x+p.w &&
     hero.y+hero.h>=p.y && hero.y+hero.h<=p.y+22){
    hero.y=p.y-hero.h;
    hero.vy=0;
    hero.onGround=true;
  }
 }

 for(const e of enemies){
  if(e.dead)continue;
  if(e.boss){
   e.y=H*.27+Math.sin(Date.now()/450)*25;
   e.x+=(hero.x-e.x)*.001;
  }else{
   e.x+=e.dir*1.2;
   let safe=platforms.some(p=>e.x+e.w/2>p.x&&e.x+e.w/2<p.x+p.w&&Math.abs(e.y+e.h-p.y)<25);
   if(!safe)e.dir*=-1;
  }
  if(overlap(hero,e))damage();
 }

 for(const c of coins){
  if(!c.got && Math.hypot(hero.x+18-c.x,hero.y+25-c.y)<32){
   c.got=true;score+=10;particle(c.x,c.y,"#ffd84f");updateHUD();
  }
 }

 for(const p of particles){
  p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life--;
 }
 particles=particles.filter(p=>p.life>0);

 if(hero.y>H+150)damage();

 const target=Math.max(0,hero.x-W*.35);
 camera+=(target-camera)*.1;

 const end=3600+stage*500;
 if(hero.x>end-180){
  const boss=enemies.find(e=>e.boss&&!e.dead);
  if(stage===3){
   if(!boss){
    score+=500;updateHUD();gameOver("GEWONNEN!","Je hebt Pythonia gered! 🐉");
   }
  }else{
   stage++;makeStage();
  }
 }
}

function draw(){
 const col=colors[stage];
 const grad=ctx.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,col[0]);grad.addColorStop(1,col[1]);
 ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

 ctx.save();
 ctx.translate(-camera,0);

 // Achtergrond
 for(let i=-2;i<14;i++){
  ctx.fillStyle="#17274a66";
  ctx.beginPath();
  ctx.moveTo(i*500,H*.78);
  ctx.lineTo(i*500+250,H*.30);
  ctx.lineTo(i*500+500,H*.78);
  ctx.fill();
 }

 // Platforms
 for(const p of platforms){
  ctx.fillStyle=col[2];ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle=col[3];ctx.fillRect(p.x,p.y,p.w,5);
 }

 // Coins
 for(const c of coins)if(!c.got){
  ctx.fillStyle="#ffd84f";
  ctx.shadowBlur=14;ctx.shadowColor="#ffd84f";
  ctx.beginPath();ctx.arc(c.x,c.y+Math.sin(Date.now()/180+c.x)*4,c.r,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
 }

 // Enemies
 for(const e of enemies){
  if(e.dead)continue;
  if(e.boss)drawBoss(e);
  else{
   ctx.fillStyle="#ed4f79";
   ctx.beginPath();ctx.arc(e.x+18,e.y+18,18,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="white";
   ctx.beginPath();ctx.arc(e.x+12,e.y+13,4,0,Math.PI*2);ctx.arc(e.x+25,e.y+13,4,0,Math.PI*2);ctx.fill();
  }
 }

 // Hero
 ctx.save();
 ctx.translate(hero.x+18,hero.y+25);
 if(hero.face<0)ctx.scale(-1,1);
 if(hero.invincible>0 && Math.floor(hero.invincible/6)%2===0)ctx.globalAlpha=.4;

 ctx.fillStyle="#64dfff";
 ctx.beginPath();ctx.arc(0,-16,15,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#263352";ctx.fillRect(-17,0,34,28);
 ctx.fillStyle="#895cf6";ctx.fillRect(-17,5,34,9);
 ctx.fillStyle="#303b5a";ctx.fillRect(-13,28,10,12);ctx.fillRect(3,28,10,12);
 ctx.fillStyle="white";ctx.beginPath();ctx.arc(6,-19,3,0,Math.PI*2);ctx.fill();
 if(hero.attackTimer>0){
  ctx.fillStyle="white";ctx.shadowBlur=14;ctx.shadowColor="#b4f2ff";
  ctx.fillRect(12,-5,42,5);ctx.shadowBlur=0;
 }
 ctx.restore();

 for(const p of particles){
  ctx.globalAlpha=p.life/30;ctx.fillStyle=p.color;
  ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
 ctx.restore();
}

function drawBoss(e){
 ctx.fillStyle="#d94e69";
 ctx.beginPath();ctx.ellipse(e.x+60,e.y+55,58,42,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#ef6b7d";
 ctx.beginPath();ctx.arc(e.x+104,e.y+28,28,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#8d294b";
 ctx.beginPath();ctx.moveTo(e.x+25,e.y+35);ctx.lineTo(e.x-12,e.y-25);ctx.lineTo(e.x+52,e.y+5);ctx.fill();
 ctx.fillStyle="white";ctx.beginPath();ctx.arc(e.x+110,e.y+20,7,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#111";ctx.beginPath();ctx.arc(e.x+112,e.y+20,3,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#ffdf55";ctx.fillRect(e.x,e.y-15,100*(e.hp/e.maxHp),6);
}

function gameOver(title,text){
 playing=false;
 document.getElementById("message").textContent=text;
 document.querySelector("#menu h1").textContent=title;
 document.getElementById("play").textContent="OPNIEUW SPELEN 🎮";
 document.getElementById("menu").style.display="flex";
}

document.getElementById("play").onclick=function(){
 stage=0;score=0;lives=3;playing=true;
 document.getElementById("menu").style.display="none";
 makeStage();
};

document.querySelectorAll(".control").forEach(btn=>{
 const key=btn.dataset.key;
 btn.addEventListener("touchstart",e=>{e.preventDefault();input[key]=true},{passive:false});
 btn.addEventListener("touchend",e=>{e.preventDefault();input[key]=false},{passive:false});
 btn.addEventListener("touchcancel",e=>{e.preventDefault();input[key]=false},{passive:false});
});

addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")input.left=true;
 if(e.key==="ArrowRight"||e.key==="d")input.right=true;
 if(e.key==="ArrowUp"||e.key===" ")input.jump=true;
 if(e.key==="z"||e.key==="x")input.attack=true;
});
addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")input.left=false;
 if(e.key==="ArrowRight"||e.key==="d")input.right=false;
});

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
